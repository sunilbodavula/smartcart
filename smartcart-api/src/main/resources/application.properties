spring.application.name=smartcart-api

# PostgreSQL database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/smartcart}
spring.datasource.username=${DB_USERNAME:smartcart_user}
spring.datasource.password=${DB_PASSWORD:smartcart_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway database migrations
spring.flyway.enabled=true

# Validate entity mappings against the database schema
spring.jpa.hibernate.ddl-auto=validate
